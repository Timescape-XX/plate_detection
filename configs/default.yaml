data:
  root: data/CCPD2019
  train_split: data/CCPD2019/splits/train.txt
  val_split: data/CCPD2019/splits/val.txt
  val_limit: 2000
  aug:
    max_rotate: 6.0
    scale_ratio: [0.85, 1.15]
    translate: 0.02
    perspective_prob: 0.3
    perspective_jitter: 0.02
    color_prob: 0.8
    blur_prob: 0.15

model:
  input_h: 320          # letterbox canvas (CCPD is 720x1160 -> nearly lossless here)
  input_w: 512
  stride: 8             # detector grid: 40 x 64
  crop_h: 32            # rectified plate crop fed to the recogniser
  crop_w: 96
  width: 1.0            # backbone channel multiplier

loss:
  cls_weight: 1.0
  giou_weight: 1.0
  corner_weight: 0.5
  ctc_weight: 1.0
  ctc_gt_weight: 0.5
  focal_alpha: 0.25
  focal_gamma: 2.0

train:
  epochs: 12
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  warmup_steps: 500
  grad_clip: 5.0
  amp: bf16
  workers: 6
  seed: 42
  log_every: 50
  val_every: 1000
  val_batches: 40

output_dir: runs/plate_net
